<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DULAT CODE — Регистрация на собеседование</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="form-card" aria-labelledby="page-title">
      <img class="logo" src="assets/logo.svg" alt="DULAT CODE">

      <div class="intro">
        <h1 id="page-title">Регистрация на собеседование</h1>
        <p class="event-date">
          Дата проведения: <time datetime="2026-09-27">27.09.2026</time>
        </p>
        <p>Заполните данные и выберите свободное время.</p>
      </div>

      <form id="interview-form" novalidate>
        <label class="field">
          <span>Ваше ФИО</span>
          <input
            id="full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="Например: Иванов Иван Иванович"
            required
          >
        </label>

        <label class="field">
          <span>Ник в Telegram</span>
          <input
            id="telegram"
            name="telegram"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="@username"
            required
          >
          <small class="field-hint">Через него мы свяжемся с вами перед собеседованием.</small>
        </label>

        <fieldset class="time-section">
          <legend>Выберите время</legend>
          <div id="time-list" class="time-list">
            <!-- Свободное время загружается из Google Sheets (см. app.js) -->
          </div>
        </fieldset>

        <button class="submit-button" type="submit">
          Записаться
        </button>
      </form>

      <div id="sold-out" class="sold-out" hidden>
        <strong>Все слоты заняты</strong>
        <p>
          Всё время на 27.09.2026 уже выбрано другими кандидатами.
          Свободных мест для записи не осталось.
        </p>
      </div>

      <p id="message" class="message" aria-live="polite"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
